<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>Student Management System</h1>
        <p class="intro">Keep track of student information all in one place.</p>

        <!-- The directory stays ABOVE the form, like your current layout. -->
        <section class="card directory-card">
            <div class="card-heading">
                <div>
                    <h2>Student Directory</h2>
                    <p>Student records grouped by department.</p>
                </div>
                <span id="totalCount" class="total-count">6 students</span>
            </div>

            <div class="department-group">
                <div class="department-heading">
                    <h3>Software Engineering</h3>
                    <span class="count" id="softwareCount">3 students</span>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr><th>ID</th><th>Name</th><th>Department</th><th>Email</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="softwareTable"></tbody>
                    </table>
                </div>
            </div>

            <div class="department-group">
                <div class="department-heading">
                    <h3>Information Technology</h3>
                    <span class="count" id="itCount">3 students</span>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr><th>ID</th><th>Name</th><th>Department</th><th>Email</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="itTable"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="card registration-card">
            <h2 id="formTitle">Student Registration</h2>
            <form id="studentForm">
                <label>
                    Full name
                    <input id="name" type="text" placeholder="Enter student's name" required>
                </label>
                <label>
                    Department
                    <select id="department" required>
                        <option value="">Select department</option>
                        <option value="Software Engineering">Software Engineering</option>
                        <option value="Information Technology">Information Technology</option>
                    </select>
                </label>
                <label>
                    Email address
                    <input id="email" type="email" placeholder="Enter student's email" required>
                </label>
                <button id="saveButton" type="submit">Add Student</button>
                <button id="cancelButton" type="button" hidden>Cancel Edit</button>
            </form>
        </section>

        <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script src="app.js"></script>
</body>
</html>
